name: release

# Publish a release when a version tag is pushed, e.g.:
#   git tag v0.1.2 && git push origin v0.1.2
#
# Or re-publish an existing tag manually (Actions -> release -> Run workflow),
# which is handy for fixing a release's notes without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: trk-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: trk-x86_64-unknown-linux-musl.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: trk-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: trk-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: trk-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # musl needs the static toolchain on Linux.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" trk

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/trk.exe" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "${RELEASE_TAG#v}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: trk-dmg-${{ matrix.target }}
          path: trk-*-macos-*.dmg
          if-no-files-found: error

  release:
    # Create the release exactly once, after every asset has been built, so the
    # body is written once (this is what previously produced several copies of
    # "Full Changelog").
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release body from CHANGELOG.md
        run: |
          python3 - "${{ env.RELEASE_TAG }}" <<'PY'
          import re
          import sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          heading = re.search(r'^## \[%s\][^\n]*\n' % re.escape(version), text, re.M)
          if not heading:
              open("release-body.md", "w", encoding="utf-8").write(
                  "See CHANGELOG.md.\n"
              )
              sys.exit(0)
          rest = text[heading.end():]
          nxt = re.search(r'^## \[', rest, re.M)
          body = rest[: nxt.start()] if nxt else rest
          open("release-body.md", "w", encoding="utf-8").write(body.strip() + "\n")
          PY
          echo "----- release body -----"
          cat release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
